
name: Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Anime Arena Legends APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Check Android SDK
        run: sdkmanager --list_installed

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Validate Gradle
        run: ./gradlew --no-daemon help --stacktrace

      - name: Build Debug APK
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE=$(find app/build/outputs/apk/debug \
            -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          ls -lh "$APK_FILE"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Anime-Arena-Legends-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Signed Release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-upload.jks
          STORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          trap 'rm -f "$KEYSTORE_PATH"' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Upload Release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Anime-Arena-Legends-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
